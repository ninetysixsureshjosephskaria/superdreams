# Super Dreams Redis configuration.
#
# Production-ready persistence defaults. The password is supplied at runtime via
# --requirepass (docker-compose), never committed here.

# Append-only persistence (durable) plus periodic snapshots.
appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

# Do not silently evict keys used as source of truth.
maxmemory-policy noeviction

# Reasonable client timeout (seconds; 0 = disabled).
timeout 0
tcp-keepalive 300
