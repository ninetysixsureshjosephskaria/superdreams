# Super Dreams — full stack (production-like) local orchestration.
#
# One-command startup:  docker compose --env-file .env.development up --build
# All configuration is environment-driven; secrets are never committed.

name: superdreams

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superdreams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-superdreams}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [superdreams]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '/usr/local/etc/redis/redis.conf',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [superdreams]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-superdreams}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-superdreams}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [superdreams]

  bcc:
    build:
      context: .
      dockerfile: infrastructure/docker/bcc/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_APP_NAME: ${BCC_APP_NAME:-Super Dreams — Business Control Center}
    restart: unless-stopped
    ports:
      - '${BCC_PORT:-8080}:8080'
    depends_on:
      - api
    networks: [superdreams]

  member:
    build:
      context: .
      dockerfile: infrastructure/docker/member/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_APP_NAME: ${MEMBER_APP_NAME:-Super Dreams — Member Portal}
    restart: unless-stopped
    ports:
      - '${MEMBER_PORT:-8081}:8080'
    depends_on:
      - api
    networks: [superdreams]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${EDGE_PORT:-80}:80'
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - bcc
      - member
    networks: [superdreams]

networks:
  superdreams:
    driver: bridge

volumes:
  pgdata:
  redisdata:
